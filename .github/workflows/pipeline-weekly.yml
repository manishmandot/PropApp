name: pipeline-weekly

on:
  # Monday 20:17 UTC = Tuesday 06:17 AEST
  schedule:
    - cron: "17 20 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Ingestion jobs never overlap (e.g. a backfill and the weekly NSW run).
concurrency:
  group: pipeline-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [nsw_vg_sales]
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: uv run python -m propapp_pipeline run ${{ matrix.source }}

  # Refresh scores with whatever loaded, even if one source failed.
  score:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WEB_URL: ${{ secrets.WEB_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: uv run python -m propapp_pipeline score
      # Map tiles carry score bands, so they are rebuilt after every scoring run.
      - run: sudo apt-get install -y -q tippecanoe
      - run: uv run python -m propapp_pipeline build-tiles
      - name: Refresh the website
        run: |
          if [ -z "$WEB_URL" ] || [ -z "$REVALIDATE_SECRET" ]; then
            echo "::notice::WEB_URL or REVALIDATE_SECRET not set; skipping site refresh"
            exit 0
          fi
          curl -fsS -X POST "$WEB_URL/api/revalidate" -H "authorization: Bearer $REVALIDATE_SECRET"
