name: pipeline-manual

on:
  workflow_dispatch:
    inputs:
      command:
        description: "e.g. 'run abs_census', 'run nsw_vg_sales --years 2015-2025', 'load-geo', 'score', 'score --cutoff 2025-12-31', 'backtest --years 2016-2024 --holdout-from 2022 --tune 200'"
        required: true
        type: string

permissions:
  contents: read

# Ingestion jobs never overlap (e.g. a backfill and the weekly NSW run).
concurrency:
  group: pipeline-ingest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      # COMMAND is split into arguments on purpose.
      - run: uv run python -m propapp_pipeline $COMMAND
      # Backtest reports and tuned weights would otherwise vanish with the runner.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoring-output
          path: |
            pipeline/scoring/reports/
            pipeline/scoring/weights/
          if-no-files-found: ignore
