name: pipeline-monthly

on:
  schedule:
    - cron: "23 19 3 * *"
  workflow_dispatch:

permissions:
  contents: read

# Ingestion jobs never overlap (e.g. a backfill and the weekly NSW run).
concurrency:
  group: pipeline-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [abs_erp, abs_building_approvals, jsa_salm, nsw_rent, vic_vg_medians, vic_dffh_rental]
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: uv run python -m propapp_pipeline run ${{ matrix.source }}

  # Refresh scores with whatever loaded, even if one source failed.
  score:
    needs: ingest
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - run: uv run python -m propapp_pipeline score
