[project]
name = "propapp-pipeline"
version = "0.1.0"
description = "PropApp data pipeline: ingests public data sources into Supabase"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/propapp_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
